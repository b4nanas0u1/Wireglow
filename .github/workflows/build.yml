name: Check and build desktop clients

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  lint-go:
    name: Go vet
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go vet
        run: |
          GOOS=linux go vet ./...
          GOOS=windows go vet ./...

  lint-flutter:
    name: Flutter analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Flutter dependencies
        working-directory: ui
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ui
        run: flutter analyze --no-pub

  test-go:
    name: Go tests (${{ matrix.os }})
    needs: [lint-go, lint-flutter]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go tests
        run: go test -count=1 -timeout 120s ./...

  test-flutter:
    name: Flutter tests (${{ matrix.os }})
    needs: [lint-go, lint-flutter]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Flutter dependencies
        working-directory: ui
        run: flutter pub get

      - name: Flutter tests
        working-directory: ui
        # Keep build metadata stable in the existing visual references.
        run: flutter test --no-pub --reporter expanded --dart-define=APP_VERSION=0.1.0

      - name: Default client version
        working-directory: ui
        run: flutter test --no-pub test/app_info_test.dart

      - name: Tagged client version
        working-directory: ui
        run: flutter test --no-pub --dart-define=APP_VERSION=v1.2.3 test/app_info_test.dart

  integration:
    name: ${{ matrix.name }} (Linux)
    needs: [lint-go, lint-flutter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: go
            name: Go integration tests
          - suite: dart-go
            name: Dart and Go IPC smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Flutter
        if: matrix.suite == 'dart-go'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-user-session dbus-x11 dconf-cli gsettings-desktop-schemas

      - name: Start user systemd
        run: |
          runner_uid=$(id -u)
          sudo systemctl start "user@${runner_uid}.service"
          export XDG_RUNTIME_DIR="/run/user/$runner_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemd-run --user --wait --pipe --collect /usr/bin/true
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Download pinned engines
        if: matrix.suite == 'go'
        run: ./scripts/download-linux-engines.sh

      - name: Go integration tests
        if: matrix.suite == 'go'
        env:
          WIREGLOW_SYSTEMD_TEST: '1'
          WIREGLOW_RECOVERY_TEST: '1'
          WIREGLOW_GSETTINGS_TEST: '1'
          WIREGLOW_MIHOMO_TEST_BINARY: ${{ github.workspace }}/.cache/engines/linux-amd64/bin/mihomo
        run: |
          source scripts/build-env.sh
          go test -count=1 -timeout 180s -v ./cmd/controller ./internal/infrastructure/platform ./internal/infrastructure/engines

      - name: Build controller for Dart interop
        if: matrix.suite == 'dart-go'
        run: |
          source scripts/build-env.sh
          mkdir -p "$cache_root/bin"
          go build -o "$cache_root/bin/controller" ./cmd/controller

      - name: Install Dart dependencies
        if: matrix.suite == 'dart-go'
        run: |
          source scripts/build-env.sh
          cd ui
          flutter pub get

      - name: Dart and Go integration smoke
        if: matrix.suite == 'dart-go'
        run: ./ui/tool/smoke.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: [test-go, test-flutter, integration]
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04
            platform: linux-x64-portable
          - os: windows-2022
            platform: windows-x64
          - os: windows-2022
            platform: windows-x64-portable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine archive version
        id: archive
        shell: pwsh
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $version = if ($env:BUILD_REF_TYPE -eq 'tag') {
            $env:BUILD_REF_NAME -creplace '^v', ''
          } else {
            'commit-' + $env:BUILD_SHA.Substring(0, 8)
          }
          $version = $version -replace '[^A-Za-z0-9._-]', '_'
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zip

      - name: Build Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLE_VARIANT: ${{ matrix.platform }}
        run: |
          if [[ "$BUNDLE_VARIANT" == linux-x64-portable ]]; then
            ./scripts/build-linux-portable.sh
          else
            ./scripts/build-linux.sh
          fi

      - name: Build Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUNDLE_VARIANT: ${{ matrix.platform }}
        run: |
          if ($env:BUNDLE_VARIANT -eq 'windows-x64-portable') {
            ./scripts/build-windows-portable.ps1
          } else {
            ./scripts/build-windows.ps1
          }

      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCHIVE_VERSION: ${{ steps.archive.outputs.version }}
          BUNDLE_VARIANT: ${{ matrix.platform }}
        run: |
          mkdir -p artifacts
          archive="$GITHUB_WORKSPACE/artifacts/Wireglow-${ARCHIVE_VERSION}-${BUNDLE_VARIANT}.zip"
          cd "dist/$BUNDLE_VARIANT"
          zip -qry "$archive" .

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE_VERSION: ${{ steps.archive.outputs.version }}
          BUNDLE_VARIANT: ${{ matrix.platform }}
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "dist/$env:BUNDLE_VARIANT/*" -DestinationPath "artifacts/Wireglow-$env:ARCHIVE_VERSION-$env:BUNDLE_VARIANT.zip"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: Wireglow-${{ steps.archive.outputs.version }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach bundles to GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: Wireglow-*
          merge-multiple: true
          path: artifacts

      - name: Calculate archive checksums
        shell: bash
        working-directory: artifacts
        run: sha256sum Wireglow-*-linux-x64.zip Wireglow-*-linux-x64-portable.zip Wireglow-*-windows-x64.zip Wireglow-*-windows-x64-portable.zip > SHA256SUMS

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Re-running a job replaces its assets without recreating the release.
          gh release upload "$RELEASE_TAG" \
            artifacts/Wireglow-*-linux-x64.zip \
            artifacts/Wireglow-*-linux-x64-portable.zip \
            artifacts/Wireglow-*-windows-x64.zip \
            artifacts/Wireglow-*-windows-x64-portable.zip \
            artifacts/SHA256SUMS \
            --clobber
